name: ci

on:
  push:
    branches: [main]
  pull_request:

# Runs on the CPU only: lint, types, unit tests, and the development model through
# tinygrad's engine. GPU checks (`pytest -m gpu`, `tinyllm bench --compare`) run on the
# Strix Halo machine, not here.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Development model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/models/Qwen3.5-0.8B-GGUF
          key: dev-models-qwen35-0.8b-q8_0-v1

      - name: Fetch development model
        run: TINYLLM_DEV_MODELS="Qwen3.5-0.8B-Q8_0.gguf" tools/fetch_dev_models.sh

      - name: Tests
        run: uv run pytest
